 
<!DOCTYPE html> 
<html lang="id"> 
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" 
        content="width=device-width, initial-scale=1.0"> 
  <title>My Profile - Ismawati</title> 
  <style> 
    * { 
      box-sizing: border-box; 
    } 
 
    body { 
      margin: 0; 
      font-family: Arial, sans-serif; 
      background: #101827; 
      color: #f8fafc; 
    } 
 
    header { 
      padding: 20px 8%; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    } 
 
    .logo { 
      color: #38bdf8; 
      font-weight: bold; 
      font-size: 22px; 
    } 
 
    nav a { 
      color: #cbd5e1; 
      text-decoration: none; 
      margin-left: 20px; 
    } 
 
    nav a:hover { 
      color: #38bdf8; 
    } 
 
    .hero { 
      min-height: 75vh; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      text-align: center; 
      padding: 40px 20px; 
    } 
 
    .profile { 
      width: 120px; 
      height: 120px; 
      border-radius: 50%; 
      object-fit: cover; 
      border: 4px solid #38bdf8; 
    } 
 
    .hero h1 { 
      font-size: 42px; 
      margin-bottom: 10px; 
    } 
 
    .hero h1 span { 
      color: #38bdf8; 
    } 
 
    .hero p { 
      color: #cbd5e1; 
    } 
 
    .button { 
      display: inline-block; 
      margin-top: 20px; 
      padding: 12px 24px; 
      background: #38bdf8; 
      color: #101827; 
      border-radius: 8px; 
      text-decoration: none; 
      font-weight: bold; 
      transition: 0.3s; 
    } 
 
    .button:hover { 
      background: #7dd3fc; 
      transform: translateY(-3px); 
    } 
 
    @media (max-width: 600px) { 
      header { 
        flex-direction: column; 
        gap: 15px; 
      } 
 
      nav a { 
        margin: 0 6px; 
      } 
 
      .hero h1 { 
        font-size: 32px; 
      } 
    } 
  </style> 
</head> 
<body> 
  <header> 
    <div class="logo">ISMA.DEV</div> 
    <nav> 
      <a href="#home">Home</a> 
      <a href="#about">About</a> 
      <a href="#project">Projects</a> 
    </nav> 
  </header> 
 
  <section class="hero" id="home"> 
    <img src="foto.jpg" 
         alt="Foto profil Ismawati" 
         class="profile"> 
 
    <p>HELLO, I'M</p> 
    <h1>Ismawati<span>.</span></h1> 
    <p>Mahasiswa Teknik Informatika</p> 
    <a href="#about" class="button"> 
      Jelajahi Profil 
    </a> 
  </section> 
</body> 
</html>
